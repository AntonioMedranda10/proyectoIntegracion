<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cliente web – Registrar producto</title>
  <style>
    :root { --borde: #d9d4cc; --texto: #2b2b2b; --suave: #6b6560; --ok: #1f7a4d; --error: #b3261e; --fondo: #faf8f5; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; font: 15px/1.5 system-ui, sans-serif; color: var(--texto); background: var(--fondo); }
    main { max-width: 980px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
    h1 { max-width: 980px; margin: 0 auto 4px; font-size: 22px; }
    .sub { max-width: 980px; margin: 0 auto 20px; color: var(--suave); }
    section { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 18px; min-width: 0; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid var(--borde); border-radius: 6px; font: inherit; }
    .error { color: var(--error); font-size: 13px; min-height: 0; }
    .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin-top: 16px; }
    .check input { width: auto; margin-top: 4px; }
    button { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 6px; background: #2b2b2b; color: #fff; font: inherit; cursor: pointer; }
    pre { margin: 0; padding: 12px; background: #f3f0eb; border-radius: 6px; overflow-x: auto; font-size: 13px; }
    .estado { font-weight: 700; margin: 12px 0 6px; }
    .estado.ok { color: var(--ok); } .estado.mal { color: var(--error); }
    .ficha { margin-top: 12px; padding: 12px; border: 1px solid var(--borde); border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Cliente web · Registrar producto</h1>
  <p class="sub">Consume <code>POST /api/v1/products</code> con el mismo contrato que usaría la app móvil.</p>

  <main>
    <section>
      <h2>Formulario</h2>
      <form id="form" novalidate>
        <label>Nombre (name) <input name="name" value="Parlante portátil"></label>
        <div class="error" data-campo="name"></div>

        <label>Descripción (description) <textarea name="description" rows="2">Resistente al agua, 12 h de batería</textarea></label>
        <div class="error" data-campo="description"></div>

        <label>Precio en USD (price) <input name="price" type="number" step="0.01" value="35.50"></label>
        <div class="error" data-campo="price"></div>

        <label>Stock (stock) <input name="stock" type="number" step="1" value="20"></label>
        <div class="error" data-campo="stock"></div>

        <label>Categoría (categoryId) <select name="categoryId"><option value="">Sin categoría</option></select></label>
        <div class="error" data-campo="categoryId"></div>

        <label class="check"><input type="checkbox" id="sinConvertir">
          Enviar los números como texto (simula un cliente que no respeta el contrato)</label>

        <button type="submit">Registrar</button>
      </form>
    </section>

    <section>
      <h2>Intercambio</h2>
      <div>JSON enviado (serializado por el cliente):</div>
      <pre id="enviado">—</pre>
      <div class="estado" id="estado"></div>
      <pre id="recibido">—</pre>
      <div id="ficha"></div>
    </section>
  </main>

  <script>
    const API = '/api/v1';
    const form = document.getElementById('form');
    const $ = (id) => document.getElementById(id);

    // Las categorías vienen del mismo backend y con el mismo contrato ({ id, name }).
    fetch(`${API}/categories`, { headers: { Accept: 'application/json' } })
      .then((res) => res.json())
      .then(({ data }) => {
        const selector = form.elements.categoryId;
        for (const categoria of data) selector.add(new Option(categoria.name, categoria.id));
        selector.value = data.find((c) => c.name === 'Electrónica')?.id ?? '';
      });

    // SERIALIZACIÓN en el cliente: los campos HTML siempre entregan texto, así que
    // se convierten a los tipos del contrato antes de armar el JSON.
    function armarSolicitud() {
      const texto = (campo) => form.elements[campo].value.trim();
      if ($('sinConvertir').checked) {
        return { name: texto('name'), description: texto('description'), price: texto('price'), stock: texto('stock'), categoryId: texto('categoryId') };
      }
      return {
        name: texto('name'),
        description: texto('description') || null,
        price: Number(texto('price')),
        stock: Number(texto('stock')),
        categoryId: texto('categoryId') ? Number(texto('categoryId')) : null,
      };
    }

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      document.querySelectorAll('.error').forEach((el) => (el.textContent = ''));
      $('ficha').innerHTML = '';

      const solicitud = armarSolicitud();
      $('enviado').textContent = JSON.stringify(solicitud, null, 2);

      const res = await fetch(`${API}/products`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(solicitud),
      });
      // DESERIALIZACIÓN en el cliente: el texto JSON vuelve a ser un objeto.
      const cuerpo = await res.json();

      $('estado').textContent = `HTTP ${res.status} ${res.statusText}`;
      $('estado').className = `estado ${res.ok ? 'ok' : 'mal'}`;
      $('recibido').textContent = JSON.stringify(cuerpo, null, 2);

      if (res.status === 201) mostrarProducto(cuerpo.data);
      if (res.status === 422) {
        for (const [campo, mensajes] of Object.entries(cuerpo.errors)) {
          const destino = document.querySelector(`.error[data-campo="${campo}"]`);
          if (destino) destino.textContent = mensajes.join(' ');
        }
      }
    });

    // El cliente usa los campos tal como los define el contrato, sin adivinar formatos.
    function mostrarProducto(p) {
      const ficha = document.createElement('div');
      ficha.className = 'ficha';
      ficha.innerHTML = '<strong></strong><div></div><div></div><div></div>';
      const [nombre, precio, stock, fecha] = ficha.children;
      nombre.textContent = `#${p.id} · ${p.name}`;
      precio.textContent = `$ ${p.price.toFixed(2)} · ${p.category ? p.category.name : 'Sin categoría'}`;
      stock.textContent = p.available ? `${p.stock} disponibles` : 'Agotado';
      fecha.textContent = `Registrado: ${new Date(p.createdAt).toLocaleString('es-EC')}`;
      $('ficha').append(ficha);
    }
  </script>
</body>
</html>
