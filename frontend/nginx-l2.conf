# NGINX del nodo L2 (192.168.10.12): solo sirve el build estático (carpeta dist/).
# Copiar dist/ a /usr/share/nginx/html y este archivo a /etc/nginx/conf.d/default.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: /login, /estado, /producto/5... deben devolver index.html al recargar
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Si alguien entra directo a este nodo (sin pasar por L1), /api y /files se
    # reenvían a NGINX (L1). Cambia la IP si L1 no es 192.168.10.11.
    location ~ ^/(api|files)/ {
        proxy_pass http://192.168.10.11;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m; # subida de imágenes de productos
    }
}
